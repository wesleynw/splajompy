version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/api/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # - package-ecosystem: "swift"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   groups:
  #     swift-dependencies:
  #       patterns:
  #         - "*"

  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    cooldown:
      exclude:
        - "golang"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/infra"
    schedule:
      interval: "weekly"
    groups:
      infra-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-dependencies:
        patterns:
          - "*"
