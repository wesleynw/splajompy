services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_CONNECTION_STRING
      - ENVIRONMENT
      - RESEND_API_KEY
      - APN_KEY_ID
      - APN_PRIVATE_KEY
      - APN_TEAM_ID
      - CLOUDFRONT_BASE_URL
      - CLOUDFRONT_KEYPAIR_ID
      - CLOUDFRONT_PRIVATE_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_RESOURCE_ATTRIBUTES
      - PYROSCOPE_USER
      - PYROSCOPE_PW
