opencollection: 1.0.0

info:
  name: Splajompy API
config:
  protobuf:
    importPaths:
      - path: ../../proto/splajompy/v1
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{authToken}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
