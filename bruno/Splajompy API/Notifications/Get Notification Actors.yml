info:
  name: Get Notification Actors
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/users/notification/:notificationId?limit=20"
  params:
    - name: limit
      value: "20"
      type: query
    - name: notificationId
      value: "99999999999"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
